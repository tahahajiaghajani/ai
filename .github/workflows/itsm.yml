      - name: Bank simulation report (stops the mock servers and restores the network)
        if: always()
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Report
      - name: Restore outbound traffic
        if: always()
        run: |
          Set-NetFirewallProfile -All -DefaultOutboundAction Allow
