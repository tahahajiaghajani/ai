          path: ${{ runner.temp }}/bank-sim
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: "Bank simulation 13-14: uninstall and re-install, and no outbound attempt"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 13,14
      - name: The evidence so far
