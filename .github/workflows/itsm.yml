# Kariz «کاریز» (itsm/) — typecheck, tests, database script check and web build; then the Windows installer built and
# smoke-tested on a real Windows machine, uploaded as an artifact and published on the Releases page; and the server
# edition's MSI («Kariz Server» / «کاریز — نسخهٔ سرور», Windows Server, air-gapped intranet: itsm/docs/SERVER_FA.md) built
# from pinned, verified binaries and smoke-tested with outbound traffic blocked, added to the same release.
# The product is «کاریز» / Kariz (APP_NAME / APP_NAME_EN in src/shared/constants.ts; the folder, tags, env vars and data
# directory keep the neutral «itsm» identifiers). Guide: itsm/docs/DESKTOP_FA.md
name: "ITSM · CI and Windows installer"

on:
  pull_request:
    paths:
      - "itsm/**"
      - ".github/workflows/itsm.yml"
  push:
    branches: ["**"]
    paths:
      - "itsm/**"
      - ".github/workflows/itsm.yml"
  workflow_dispatch:

concurrency:
  group: itsm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    # a pull request from this repository is already built by the push of its branch
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: itsm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: itsm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
        env:
          # the TypeScript program of all modules needs more than Node's default heap on smaller runners
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run check:schema
      - run: npm run build

  # the whole suite (every test, nothing skipped) in four parallel shards: one runner needs more than 25 minutes
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: itsm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: itsm/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  # click-through QA (itsm/docs/qa/CLICKTHROUGH.md): the main page of every space, the requester portal, the platform
  # console and the sign-in pages as the administrator, and the agent's and requester's home pages, on the
  # Windows-flavour local server (PGlite) — console errors, crashes, «not found», failed API calls, endless loaders.
  # About 7 minutes; the full crawl (every route, «… تازه», records and their tabs, phone width) is `npm run qa:crawl`
  # (about 35 minutes).
  clickthrough:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: itsm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: itsm/package-lock.json
      - run: npm ci
      - name: Playwright and its Chromium (a tool of the crawler, not a dependency of the app)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Click-through of the main pages
        run: npm run qa:crawl -- --quick --out qa-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itsm-clickthrough
          path: itsm/qa-report
          if-no-files-found: ignore

  windows:
    needs: [check, test]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: itsm
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            itsm/package-lock.json
            itsm/desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: itsm/desktop
      - name: Prepare the app (UI, local server, Electron main)
        run: node scripts/build-desktop.mjs
      - name: Build the installer
        working-directory: itsm/desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test — silent install, start, health check, uninstall
        shell: pwsh
        working-directory: itsm/desktop
        run: |
          $setup = Get-ChildItem release/Kariz-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Kariz\Kariz.exe'
          if (!(Test-Path $app)) { throw "Kariz.exe was not installed" }
          $env:ITSM_SMOKE = '1'
          $env:ITSM_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:ITSM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'itsm-data'
          $p = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait
          Get-Content $env:ITSM_SMOKE_OUT
          Get-Content (Join-Path $env:ITSM_DATA_DIR 'logs\app.log') -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          $uninst = Join-Path $env:LOCALAPPDATA 'Programs\Kariz\Uninstall Kariz.exe'
          if (Test-Path $uninst) { Start-Process -FilePath $uninst -ArgumentList '/S' -Wait }
      - uses: actions/upload-artifact@v4
        with:
          name: itsm-windows-installer
          path: itsm/desktop/release/Kariz-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish on the Releases page
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          CHANNEL=$(node -p "require('./desktop/package.json').releaseChannel || ''")
          NOTES="فایل نصب ویندوز «کاریز» (Kariz؛ سامانهٔ سازمانی مدیریت خدمات فناوری اطلاعات و خدمات سازمانی). فایل Kariz-Setup را دانلود کنید (می‌توانید روی فلش هم کپی کنید) و اجرا کنید؛ همه‌چیز خودکار نصب می‌شود. راهنما: itsm/docs/DESKTOP_FA.md"
          # on main, a beta (releaseChannel "beta" in desktop/package.json) is its own pre-release itsm-v<version>-beta, so
          # the last official release stays «Latest», and a final version publishes itsm-v<version>; every other branch
          # publishes only its own preview (work in progress never replaces a release people download, and two branches
          # pushed close together never mix their installers)
          if [ "$CHANNEL" = "beta" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="itsm-v${VERSION}-beta"; TITLE="کاریز (Kariz) ${VERSION} — بتا"; PRE="--prerelease"
            NOTES="نسخهٔ آزمایشی (بتا) «کاریز» ${VERSION}. Kariz-Setup: نسخهٔ ویندوز (نصب با یک کلیک). Kariz-Server: نسخهٔ سرور برای شبکهٔ داخلی (MSI). تازه‌ها و راهنمای نصب: itsm/docs/RELEASE_FA.md"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="itsm-v${VERSION}"; TITLE="کاریز (Kariz) ${VERSION} — نسخهٔ ویندوز"; PRE=""; else TAG="itsm-preview-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"; TITLE="کاریز (Kariz) ${VERSION} — پیش‌نمایش (${GITHUB_REF_NAME})"; PRE="--prerelease"; fi
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" desktop/release/Kariz-Setup-*.exe --target "$GITHUB_SHA" --title "$TITLE" $PRE --notes "$NOTES"

  desktop-e2e:
    # the Windows app as people use it, on a Windows runner (itsm/docs/qa/PERFORMANCE_E2E_FA.md): this run's Kariz-Setup
    # installed silently (/S), the installed Kariz.exe driven through Playwright's Electron support
    # (itsm/scripts/desktop-e2e.mjs; the app's own flags and security settings untouched) — the first-run setup as a
    # person fills it, the bank demo pack «کوچک», a member added, the main pages as the administrator and, after «خروج»
    # and a sign-in, as the member, the window closed, a second start —, timed (starts, every route change, the API as
    # the renderer sees it, memory and CPU of the main, renderer and local server processes every second, the database's
    # write-ahead log every second while the app runs, its folder at the end) and gated on console errors, budgets (the
    # log's peak while the app runs among them) and a checkpoint of the app's own scheduler before the first close.
    # Screenshots, report.json and report.md (also the job summary) and the app's log as the artifact.
    needs: [windows]
    # its own condition: with the default one a job skipped anywhere before `windows` would skip this one too
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: itsm
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright (a tool of the test, not a dependency of the app; the Electron it drives is the installed app)
        run: |
          npm install --prefix "$env:RUNNER_TEMP/e2e-tools" --no-save --no-audit --no-fund playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: itsm-windows-installer
          path: itsm/desktop-e2e-installer
      - name: Install this run's Kariz-Setup silently, as a software deployment would
        run: |
          $setup = Get-ChildItem desktop-e2e-installer/Kariz-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          $t = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Kariz\Kariz.exe'
          if (!(Test-Path $exe)) { throw "Kariz.exe was not installed" }
          Write-Host "installed in $([math]::Round($t.Elapsed.TotalSeconds, 1)) s"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/desktop-e2e" | Out-Null
          Set-Content -LiteralPath "$env:RUNNER_TEMP/desktop-e2e/install.json" -Value (@{ installer = $setup.Name; installer_mb = [math]::Round($setup.Length/1MB,1); install_s = [math]::Round($t.Elapsed.TotalSeconds,1) } | ConvertTo-Json) -Encoding UTF8
          # a silent install starts nothing; anything named Kariz now would hold the single-instance lock
          Get-Process Kariz -ErrorAction SilentlyContinue | Stop-Process -Force
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "KARIZ_EXE=$exe" -Encoding UTF8
      - name: The installed app as the administrator and as a member (setup, demo pack «کوچک», main pages, two starts)
        run: node scripts/desktop-e2e.mjs --exe "$env:KARIZ_EXE" --out "$env:RUNNER_TEMP/desktop-e2e" --playwright "$env:RUNNER_TEMP/e2e-tools"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itsm-desktop-e2e
          path: ${{ runner.temp }}/desktop-e2e
          if-no-files-found: ignore
          retention-days: 30
      - name: Uninstall
        if: always()
        run: |
          Get-Process Kariz -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninst = Join-Path $env:LOCALAPPDATA 'Programs\Kariz\Uninstall Kariz.exe'
          if (Test-Path $uninst) { Start-Process -FilePath $uninst -ArgumentList '/S' -Wait }

  server:
    # the server edition: bundle, pinned Node.js / PostgreSQL 17 / WinSW / WiX (SHA-256 checked, cached), pgvector
    # compiled with MSVC, the MSI, and an air-gapped smoke test (install with 443/80 held by other programs on the free
    # ports it picks, setup, sign-in, incident, backup, re-install with the setup dialog's properties, upgrade keeping the
    # ports, uninstall keeping data, a given busy port refused with its reason in install-error.txt and the event log).
    # Guide: itsm/docs/SERVER_FA.md; design: itsm/docs/spec/SERVER.md
    needs: [check, test]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: itsm
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: itsm/package-lock.json
      - run: npm ci
      - name: The installer scripts parse under Windows PowerShell 5.1 (the MSI runs them with powershell.exe)
        shell: powershell
        run: |
          $failed = 0
          foreach ($f in @(Get-Item packaging/server/scripts/install.ps1, packaging/server/scripts/uninstall.ps1, packaging/server/scripts/common.ps1, packaging/server/scripts/smoke-test.ps1, packaging/server/scripts/build-msi.ps1) + @(Get-ChildItem packaging/server/scripts/bank-sim/*.ps1)) {
            $errors = $null
            # a script without a byte-order mark is read in the ANSI code page, as powershell.exe -File reads it
            [void][System.Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($f.FullName, [Text.Encoding]::Default), [ref]$null, [ref]$errors)
            foreach ($e in @($errors)) { if ($e) { $failed++; Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Cache pinned binaries (Node.js, PostgreSQL, WinSW, WiX)
        uses: actions/cache@v4
        with:
          path: itsm/packaging/server/.cache
          key: itsm-server-deps-${{ hashFiles('itsm/packaging/server/deps.json') }}
      - name: Build the server bundle (server.cjs, karizctl.cjs, pre-compressed app)
        run: node scripts/build-server.mjs
      - name: Windows sign-in module in the package (node-expose-sspi, loaded from app/node_modules)
        run: |
          foreach ($f in @("package.json", "lib/api.js", "lib/arch/x64/node-expose-sspi.node")) {
            if (-not (Test-Path "server-dist/app/node_modules/node-expose-sspi/$f")) { throw "node-expose-sspi/$f is missing from the server package" }
          }
      - name: Fetch and verify pinned binaries
        run: ./packaging/server/scripts/fetch-deps.ps1 -Dist server-dist -Cache packaging/server/.cache
      - name: The binding loads with the packaged Node.js, as src/server/auth/sso.ts loads it
        run: |
          & server-dist/node/node.exe -e "const r=require('module').createRequire(require('path').resolve('server-dist/app/noop.js')); const m=r('node-expose-sspi/lib/api.js'); if(!m.sspi) throw new Error('no sspi binding'); console.log('node-expose-sspi loads')"
          if ($LASTEXITCODE -ne 0) { throw "node-expose-sspi does not load with the packaged Node.js" }
      - name: Build pgvector with MSVC
        run: ./packaging/server/scripts/build-pgvector.ps1 -Dist server-dist -Cache packaging/server/.cache -AllowMissing
      - name: Build the MSI (and a second build of the same version for the upgrade test)
        run: |
          ./packaging/server/scripts/build-msi.ps1 -Dist server-dist -Cache packaging/server/.cache -Out server-release
          ./packaging/server/scripts/build-msi.ps1 -Dist server-dist -Cache packaging/server/.cache -Out server-upgrade-test -Suffix '-upgrade-test'
      - name: Air-gapped smoke test (443/80 held, default ports, setup, sign-in, incident, backup, re-install with dialog properties, upgrade, uninstall, busy given port)
        run: |
          $msi = Get-ChildItem server-release/*.msi | Select-Object -First 1
          $upgrade = Get-ChildItem server-upgrade-test/*.msi | Select-Object -First 1
          ./packaging/server/scripts/smoke-test.ps1 -Msi $msi.FullName -UpgradeMsi $upgrade.FullName -Logs "$env:RUNNER_TEMP/kariz-logs"
      - name: Restore outbound traffic
        if: always()
        run: Set-NetFirewallProfile -All -DefaultOutboundAction Allow
      - uses: actions/upload-artifact@v4
        with:
          name: itsm-server-msi
          path: itsm/server-release/*.msi
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itsm-server-logs
          path: ${{ runner.temp }}/kariz-logs
          if-no-files-found: ignore
          retention-days: 14

  server-publish:
    # after the desktop job created (or re-created) the release: add the server MSI to it
    needs: [windows, server]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: itsm-server-msi
          path: server-release
      - name: Add the MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./itsm/desktop/package.json').version")
          CHANNEL=$(node -p "require('./itsm/desktop/package.json').releaseChannel || ''")
          # the same tag rules as the windows job's «Publish on the Releases page»
          if [ "$CHANNEL" = "beta" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="itsm-v${VERSION}-beta"; TITLE="کاریز (Kariz) ${VERSION} — بتا"; PRE="--prerelease"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="itsm-v${VERSION}"; TITLE="کاریز (Kariz) ${VERSION} — نسخهٔ ویندوز"; PRE=""; else TAG="itsm-preview-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"; TITLE="کاریز (Kariz) ${VERSION} — پیش‌نمایش (${GITHUB_REF_NAME})"; PRE="--prerelease"; fi
          # only this commit's release: a newer push of the branch re-created it and publishes its own MSI
          TARGET=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if [ -z "$TARGET" ]; then
            gh release create "$TAG" server-release/*.msi --target "$GITHUB_SHA" --title "$TITLE" $PRE --notes "نسخهٔ سرور (MSI). راهنما: itsm/docs/SERVER_FA.md"
          elif [ "$TARGET" != "$GITHUB_SHA" ]; then
            echo "::notice::release $TAG is for $TARGET, not $GITHUB_SHA: the MSI is not added (a newer run publishes its own)"
            exit 0
          else
            gh release upload "$TAG" server-release/*.msi --clobber
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

  bank-sim:
    # the bank's installation simulated end to end (itsm/docs/qa/BANK_SIM_FA.md, runbook itsm/docs/BANK_INSTALL_FA.md):
    # this runner becomes the bank's application server on an intranet with no Internet (Windows Firewall blocks all
    # outbound traffic but the LAN, every dropped packet logged, every connection audited with its program), a bank
    # PKI made with PowerShell, a mock domain controller (LDAPS) and mail relay (STARTTLS) on the LAN address; 1.0.0
    # (release itsm-v1.0.0) installed as the bank's admin would, set up in the browser, filled with records, backed
    # up, upgraded in place to the MSI of this run, browsed by Playwright's Chromium as a branch PC (the bank CA
    # trusted through the Windows store, no foreign request, no console error), demo data loaded and purged,
    # security posture, resilience, load, a DR drill, the Windows app's sync client, uninstall and re-install, and the
    # proof that the server's processes never tried to reach outside the bank. Everything it needs is fetched first.
    needs: [server]
    if: ${{ !cancelled() && needs.server.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: itsm
        shell: powershell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: itsm/package-lock.json
      - run: npm ci
      - name: Fetch everything before the Internet is cut (Playwright and Chromium, the 1.0.0 MSI, this run's MSI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path bank-sim/msi-1.0.0 | Out-Null
          gh release download itsm-v1.0.0 --repo $env:GITHUB_REPOSITORY --pattern 'Kariz-Server-1.0.0.msi' --dir bank-sim/msi-1.0.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: itsm-server-msi
          path: itsm/bank-sim/msi-this-run
      # The simulation runs in steps (no Internet from the first on): the context carries over in bank-sim\context.json,
      # a critical failure stops the later steps, and the evidence so far is uploaded after every step, so a step that
      # fails (or a runner that is lost) leaves its logs behind. The report step writes report.md and the job summary.
      - name: The MSIs of the simulation
        run: |
          $old = Get-ChildItem bank-sim/msi-1.0.0/*.msi | Select-Object -First 1
          $new = Get-ChildItem bank-sim/msi-this-run/*.msi | Select-Object -First 1
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BANK_SIM_MSI10=$($old.FullName)", "BANK_SIM_MSI11=$($new.FullName)", "BANK_SIM_OUT=$env:RUNNER_TEMP\bank-sim" -Encoding UTF8
      - name: "Bank simulation 1-3: the Internet cut, the bank PKI, 1.0.0 installed and set up as the bank's admin would"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 1,2,3
      - name: The evidence so far
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: itsm-bank-sim
          path: ${{ runner.temp }}/bank-sim
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: "Bank simulation 4-6: backup, upgrade in place to this build, a LAN client in Chromium"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 4,5,6
      - name: The evidence so far
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: itsm-bank-sim
          path: ${{ runner.temp }}/bank-sim
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: "Bank simulation 7: demo data loaded, browsed and purged"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 7
      - name: The evidence so far
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: itsm-bank-sim
          path: ${{ runner.temp }}/bank-sim
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: "Bank simulation 8-9: security posture and resilience"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 8,9
      - name: The evidence so far
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: itsm-bank-sim
          path: ${{ runner.temp }}/bank-sim
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: "Bank simulation 10: load"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 10
      - name: The evidence so far
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: itsm-bank-sim
          path: ${{ runner.temp }}/bank-sim
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: "Bank simulation 11-12: DR drill and the Windows app's sync client"
        run: ./packaging/server/scripts/bank-sim/bank-sim.ps1 -Msi10 $env:BANK_SIM_MSI10 -Msi11 $env:BANK_SIM_MSI11 -Out $env:BANK_SIM_OUT -Only 11,12
      - name: The evidence so far
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
