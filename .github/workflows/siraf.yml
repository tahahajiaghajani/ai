# «سیراف» — typecheck, tests and web build; then the Windows installer built and smoke-tested on a
# real Windows machine, uploaded as an artifact and published on the Releases page.
name: "Siraf · CI and Windows installer"

on:
  pull_request:
    paths:
      - "siraf/**"
      - ".github/workflows/siraf.yml"
  push:
    branches: ["**"]
    paths:
      - "siraf/**"
      - ".github/workflows/siraf.yml"
  workflow_dispatch:

concurrency:
  group: siraf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    # a pull request from this repository is already built by the push of its branch
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: siraf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siraf/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:schema
      - run: npm run build

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: siraf
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            siraf/package-lock.json
            siraf/desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: siraf/desktop
      - name: Prepare the app (UI, local server, Electron main)
        run: node scripts/build-desktop.mjs
      - name: Build the installer
        working-directory: siraf/desktop
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test — silent install, start, health check, uninstall
        shell: pwsh
        working-directory: siraf/desktop
        run: |
          $setup = Get-ChildItem release/Siraf-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Siraf\Siraf.exe'
          if (!(Test-Path $app)) { throw "Siraf.exe was not installed" }
          $env:TARAZ_SMOKE = '1'
          $env:TARAZ_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:TARAZ_DATA_DIR = Join-Path $env:RUNNER_TEMP 'siraf-data'
          $p = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait
          Get-Content $env:TARAZ_SMOKE_OUT
          Get-Content (Join-Path $env:TARAZ_DATA_DIR 'logs\app.log') -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          $uninst = Join-Path $env:LOCALAPPDATA 'Programs\Siraf\Uninstall Siraf.exe'
          if (Test-Path $uninst) { Start-Process -FilePath $uninst -ArgumentList '/S' -Wait }
      - uses: actions/upload-artifact@v4
        with:
          name: siraf-windows-installer
          path: siraf/desktop/release/Siraf-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish on the Releases page
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="siraf-v${VERSION}"; TITLE="سیراف ${VERSION} — نسخه‌ی ویندوز"; PRE=""; else TAG="siraf-preview"; TITLE="سیراف ${VERSION} — پیش‌نمایش (${GITHUB_REF_NAME})"; PRE="--prerelease"; fi
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" desktop/release/Siraf-Setup-*.exe --target "$GITHUB_SHA" --title "$TITLE" $PRE \
            --notes "فایل نصب ویندوز «سیراف». فایل Siraf-Setup را دانلود کنید (می‌توانید روی فلش هم کپی کنید) و اجرا کنید؛ همه‌چیز خودکار نصب می‌شود. راهنما: siraf/docs/DESKTOP_FA.md"
