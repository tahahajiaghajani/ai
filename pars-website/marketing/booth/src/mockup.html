<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booth mockup — Pars Project Management</title>
<style>
/* A 3/4 view of the whole booth, built in CSS 3D at real sizes (1 cm = K px) from the rendered previews:
   the pop-up with its two returns, roll-up 2 on the left and roll-up 1 on the right (their streams flow in from the
   outer edges), and the two identical counters in front. ?style=minimal|detailed|final&mode=dark|light — final is the
   chosen set: the minimal pop-up and counters with the detailed roll-ups */
@font-face { font-family: "Sora"; font-weight: 600; src: url(assets/fonts/sora-latin-600-normal.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 2400px; height: 1500px; overflow: hidden; }
body { background: var(--hall); }
:root[data-mode="dark"] { --hall: #1a1a22; --wall: linear-gradient(180deg, #2c2c36, #202028 70%); --floor: radial-gradient(ellipse at 50% 30%, #3a3a44, #24242c 60%, #18181e); --top: #e9e8ef; --edge: #c9c8d2; --metal: linear-gradient(90deg, #8d8d96, #d8d8de 45%, #8d8d96); --shade: rgba(0, 0, 0, .34); --cap: #e4e4ea; }
:root[data-mode="light"] { --hall: #e9e8ee; --wall: linear-gradient(180deg, #f4f3f8, #e6e5ec 70%); --floor: radial-gradient(ellipse at 50% 30%, #dcdbe3, #cfced8 60%, #c4c3ce); --top: #ffffff; --edge: #d9d8e0; --metal: linear-gradient(90deg, #9a9aa3, #e6e6eb 45%, #9a9aa3); --shade: rgba(20, 18, 40, .2); --cap: #f3f3f6; }
#stage { position: absolute; inset: 0; perspective: 2300px; perspective-origin: 50% 34%; overflow: hidden; }
#world { position: absolute; left: 50%; top: 73%; transform-style: preserve-3d; }
.p { position: absolute; left: 0; top: 0; transform-style: preserve-3d; background-repeat: no-repeat; backface-visibility: visible; will-change: transform; }
.p.side::after { content: ""; position: absolute; inset: 0; background: var(--shade); }
.shadow { background: radial-gradient(closest-side, rgba(0, 0, 0, .42), transparent); }
:root[data-mode="light"] .shadow { background: radial-gradient(closest-side, rgba(20, 18, 40, .26), transparent); }
#label { position: absolute; left: 60px; top: 48px; font: 600 26px/1.4 "Sora", sans-serif; color: rgba(255, 255, 255, .55); letter-spacing: .02em; }
:root[data-mode="light"] #label { color: rgba(26, 24, 58, .5); }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<div id="label"></div>
<script>
const Q = new URLSearchParams(location.search);
const STYLE = Q.get("style") ?? "minimal", MODE = Q.get("mode") ?? "dark";
document.documentElement.dataset.mode = MODE;
const K = 3.2; // px per cm
const world = document.getElementById("world");
world.style.transform = "rotateX(-8deg) rotateY(-17deg) translateZ(-330px)";
const PICK = { popup: "minimal", rollup1: "detailed", rollup2: "detailed", counter: "minimal" };
const tex = (item) => `url(preview/${item}-${STYLE === "final" ? PICK[item] : STYLE}-${MODE}.png)`;

/** a plane w × h cm centred at (x, y above the floor, z towards the viewer), turned by ry degrees about the vertical
    (90: faces +x, its left edge in front). bg: a texture strip [file width, offset into the file] or a CSS background. */
function plane(x, y, z, w, h, { ry = 0, rx = 0, bg, strip, cls = "" } = {}) {
  const n = document.createElement("div");
  n.className = "p " + cls;
  n.style.width = w * K + "px";
  n.style.height = h * K + "px";
  n.style.marginLeft = (-w * K) / 2 + "px";
  n.style.marginTop = (-h * K) / 2 + "px";
  n.style.transform = `translate3d(${x * K}px, ${-y * K}px, ${z * K}px) rotateY(${ry}deg) rotateX(${rx}deg)`;
  if (strip) {
    const [img, fw, fh, off, top = 0] = strip; // the visible part: file x from off to off + w, y from top to top + h
    n.style.backgroundImage = img;
    n.style.backgroundSize = `${(fw / w) * 100}% ${(fh / h) * 100}%`;
    n.style.backgroundPosition = `${fw === w ? 0 : (off / (fw - w)) * 100}% ${fh === h ? 0 : (top / (fh - h)) * 100}%`;
  } else if (bg) n.style.background = bg;
  world.appendChild(n);
  return n;
}
const floorSpot = (x, z, w, d) => plane(x, 0.2, z, w, d, { rx: 90, cls: "shadow" });

// hall: back wall and floor
plane(0, 260, -260, 2200, 520, { bg: "var(--wall)" });
plane(0, 0, 110, 2200, 740, { rx: 90, bg: "var(--floor)" }); // kept clear of the camera plane: Chromium clips planes that cross it

// pop-up: face 291 × 230 at z = 0, returns wrap back 35 cm at each end
const POP = tex("popup");
floorSpot(0, 26, 330, 40); // in front of the face: a shadow plane that cuts through a panel makes Chromium drop part of it
plane(0, 115, 0, 291, 230, { strip: [POP, 361, 230, 35] });
plane(-145.5, 115, -17.5, 35, 230, { ry: -90, strip: [POP, 361, 230, 0], cls: "side" });
plane(145.5, 115, -17.5, 35, 230, { ry: 90, strip: [POP, 361, 230, 326], cls: "side" });

// roll-ups: the 85 × 200 trim (5 cm bleed off each edge) standing in its cassette, which hides the lowest part.
// No plane may cut through the banner (Chromium drops part of a plane that another one crosses), so the banner ends
// just above the floor and the cassette lies entirely in front of it.
function rollup(item, x, z) {
  const img = tex(item);
  floorSpot(x, z, 120, 50);
  plane(x, 100.5, z, 85, 200, { strip: [img, 95, 210, 5, 5] });
  plane(x, 201.1, z + 0.6, 86, 1.6, { bg: "var(--metal)" });            // top rail
  plane(x, 5, z + 10, 92, 10, { bg: "var(--metal)" });                   // the cassette, front
  plane(x, 10, z + 5.5, 92, 9, { rx: 90, bg: "var(--cap)" });            // and its top
  for (const dx of [-38, 38]) plane(x + dx, 1.5, z + 14, 3, 3, { bg: "var(--metal)" }); // feet
}
rollup("rollup2", -238, 70);
rollup("rollup1", 238, 70);

// counters: front 70 wide, sides 72 deep, 90 high, a white top
function counter(x, z) {
  const img = tex("counter");
  floorSpot(x, z, 130, 120);
  plane(x, 45, z + 36, 70, 90, { strip: [img, 214, 90, 72] });
  plane(x - 35, 45, z, 72, 90, { ry: -90, strip: [img, 214, 90, 0], cls: "side" });
  plane(x + 35, 45, z, 72, 90, { ry: 90, strip: [img, 214, 90, 142], cls: "side" });
  plane(x, 92, z, 76, 78, { rx: 90, bg: "var(--top)" });
  plane(x, 91, z + 39, 76, 2, { bg: "var(--edge)" });
  plane(x + 38, 91, z, 78, 2, { ry: 90, bg: "var(--edge)" });
}
counter(-72, 175);
counter(72, 175);

document.getElementById("label").textContent = `PARS PROJECT · BOOTH · ${STYLE === "final" ? "FINAL SET" : STYLE.toUpperCase()} · ${MODE.toUpperCase()}`;
Promise.all([...new Set([...document.querySelectorAll(".p")].map((n) => n.style.backgroundImage).filter(Boolean))].map((u) => new Promise((r, j) => {
  const i = new Image();
  i.onload = r;
  i.onerror = () => j(new Error("missing " + u));
  i.src = u.slice(5, -2);
}))).then(() => (document.documentElement.dataset.ready = "1"), (e) => (document.documentElement.dataset.error = e.message));
</script>
</body>
</html>
