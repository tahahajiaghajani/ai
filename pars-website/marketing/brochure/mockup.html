<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:760px;overflow:hidden;position:relative;
  background:radial-gradient(70% 60% at 50% 38%,#f4f3f9 0%,#e3e1ee 55%,#cfcce0 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35}
.floor{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(26,24,58,.06))}
.scene{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 30%}
.obj{position:absolute;transform-style:preserve-3d}
.pn{position:absolute;top:0;background-size:100% 100%;backface-visibility:hidden}
.pn::after{content:"";position:absolute;inset:0;background:var(--light,transparent)}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(20,16,50,.42),rgba(20,16,50,0));filter:blur(6px)}
.edge{position:absolute;top:0;bottom:0;width:4px;background:linear-gradient(90deg,#1b1a3f,#0c0b22)}
</style></head><body>
<div class="blob" style="width:520px;height:360px;left:-80px;top:-60px;background:#8f86ff"></div>
<div class="blob" style="width:520px;height:360px;right:-120px;top:-40px;background:#ff4fa3"></div>
<div class="floor"></div>
<div class="scene">
  <!-- open inside spread standing as a folding screen -->
  <div class="shadow" style="left:300px;top:478px;width:620px;height:60px"></div>
  <div class="obj" id="open" style="left:600px;top:54px;transform:rotateX(4deg)">
    <div class="pn" style="left:-104px;width:209px;height:440px;background-image:url(panels/4-middle-inner.png);--light:linear-gradient(90deg,rgba(255,255,255,.03),rgba(0,0,0,.06));box-shadow:0 18px 40px rgba(20,16,50,.28)"></div>
    <div class="obj" style="left:-104px;top:0;transform-origin:0 0;transform:rotateY(-34deg)">
      <div class="pn" style="left:-203px;width:203px;height:440px;background-image:url(panels/5-foldin-inner.png);transform-origin:100% 50%;--light:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.08));box-shadow:0 18px 40px rgba(20,16,50,.25)"></div>
    </div>
    <div class="obj" style="left:105px;top:0;transform-origin:0 0;transform:rotateY(34deg)">
      <div class="pn" style="left:0;width:209px;height:440px;background-image:url(panels/2-cover-inner.png);--light:linear-gradient(90deg,rgba(255,255,255,.07),rgba(0,0,0,.2));box-shadow:0 18px 40px rgba(20,16,50,.25)"></div>
    </div>
  </div>
  <!-- closed: the cover, front left -->
  <div class="shadow" style="left:118px;top:688px;width:330px;height:46px"></div>
  <div class="obj" style="left:170px;top:318px;transform:rotateY(24deg) rotateZ(-3deg)">
    <div class="edge" style="left:-4px;height:400px"></div>
    <div class="pn" style="left:0;width:190px;height:400px;background-image:url(panels/1-cover.png);--light:linear-gradient(110deg,rgba(255,255,255,.12),rgba(255,255,255,0) 40%,rgba(0,0,0,.12));box-shadow:-2px 22px 46px rgba(20,16,50,.45)"></div>
  </div>
  <!-- closed: the back with the QR, front right -->
  <div class="shadow" style="left:790px;top:694px;width:320px;height:46px"></div>
  <div class="obj" style="left:842px;top:322px;transform:rotateY(-24deg) rotateZ(3deg)">
    <div class="pn" style="left:0;width:190px;height:400px;background-image:url(panels/6-back-qr.png);--light:linear-gradient(250deg,rgba(255,255,255,.12),rgba(255,255,255,0) 40%,rgba(0,0,0,.14));box-shadow:2px 22px 46px rgba(20,16,50,.45)"></div>
    <div class="edge" style="left:190px;height:400px"></div>
  </div>
</div>
</body></html>
