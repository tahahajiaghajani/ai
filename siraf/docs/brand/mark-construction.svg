<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -24 120 112" width="600" height="560" role="img" aria-label="ساختار نشان سیراف">
  <title>ساختار نشان «اندازه»</title>
  <!-- Mark A «اندازه», the measured alef, on its 8-unit lattice (64-unit artboard, light grid) with the 16-unit clear space
       (dashed). One qalam at 45°: the alef is a parallelogram 8 wide (inner edge y 12–60, outer edge y 4–52); each nuqta is
       a square on its tip, diagonal 16 = 2 × stroke; the column of three spans the alef's inner edge (3 × 16 = 48) and
       carries its area (3 × 128 = 8 × 48 = 384). -->
  <rect x="-28" y="-24" width="120" height="112" fill="#F7F4F0"/>
  <g stroke="#221D18" stroke-opacity=".07" stroke-width=".25">
    <line x1="-16" y1="-16" x2="-16" y2="80" />
    <line x1="-16" y1="-16" x2="80" y2="-16" />
    <line x1="-8" y1="-16" x2="-8" y2="80" />
    <line x1="-16" y1="-8" x2="80" y2="-8" />
    <line x1="0" y1="-16" x2="0" y2="80" />
    <line x1="-16" y1="0" x2="80" y2="0" />
    <line x1="8" y1="-16" x2="8" y2="80" />
    <line x1="-16" y1="8" x2="80" y2="8" />
    <line x1="16" y1="-16" x2="16" y2="80" />
    <line x1="-16" y1="16" x2="80" y2="16" />
    <line x1="24" y1="-16" x2="24" y2="80" />
    <line x1="-16" y1="24" x2="80" y2="24" />
    <line x1="32" y1="-16" x2="32" y2="80" />
    <line x1="-16" y1="32" x2="80" y2="32" />
    <line x1="40" y1="-16" x2="40" y2="80" />
    <line x1="-16" y1="40" x2="80" y2="40" />
    <line x1="48" y1="-16" x2="48" y2="80" />
    <line x1="-16" y1="48" x2="80" y2="48" />
    <line x1="56" y1="-16" x2="56" y2="80" />
    <line x1="-16" y1="56" x2="80" y2="56" />
    <line x1="64" y1="-16" x2="64" y2="80" />
    <line x1="-16" y1="64" x2="80" y2="64" />
    <line x1="72" y1="-16" x2="72" y2="80" />
    <line x1="-16" y1="72" x2="80" y2="72" />
    <line x1="80" y1="-16" x2="80" y2="80" />
    <line x1="-16" y1="80" x2="80" y2="80" />
  </g>
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="#221D18" stroke-opacity=".22" stroke-width=".3"/>
  <rect x="-16" y="-16" width="96" height="96" fill="none" stroke="#8C4384" stroke-opacity=".55" stroke-width=".3" stroke-dasharray="1.2 1.2"/>
  <g fill="#6A2E63">
    <path d="M40 12L48 4V52L40 60Z"/>
    <path d="M24 12L32 20L24 28L16 20Z"/>
    <path d="M24 28L32 36L24 44L16 36Z"/>
    <path d="M24 44L32 52L24 60L16 52Z"/>
  </g>
  <!-- 45° nib lines through the alef's ends -->
  <g stroke="#8C4384" stroke-width=".3" stroke-opacity=".7">
    <line x1="36" y1="16" x2="52" y2="0"/>
    <line x1="36" y1="64" x2="52" y2="48"/>
  </g>
  <!-- dimensions -->
  <g stroke="#544F49" stroke-width=".3" fill="none">
    <path d="M10 12V60M9 12h2M9 60h2"/>
    <path d="M54 12V60M53 12h2M53 60h2"/>
    <path d="M40 68h8M40 67v2M48 67v2"/>
    <path d="M16 68h16M16 67v2M32 67v2"/>
  </g>
  <g fill="#544F49" font-family="Vazirmatn, Tahoma, sans-serif" font-size="3.2" text-anchor="middle">
    <text x="6" y="37.2">۴۸</text>
    <text x="58.5" y="37.2">۴۸</text>
    <text x="44" y="73">۸</text>
    <text x="24" y="73">۱۶</text>
    <text x="32" y="-18.5" fill="#8C4384">فضای خالی ۱۶</text>
    <text x="32" y="84.5">شبکهٔ ۸ واحدی · صفحهٔ ۶۴ واحدی · قلم ۴۵ درجه</text>
  </g>
</svg>
