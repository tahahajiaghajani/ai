<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f33" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>تراز — حسابداری و مدیریت کسب‌وکار</title>
    <script>
      try {
        var t = localStorage.getItem("taraz.theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark">تراز</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
